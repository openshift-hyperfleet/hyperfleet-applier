{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hyperfleet-applier.fullname" . }}
  labels:
    {{- include "hyperfleet-applier.labels" . | nindent 4 }}
rules:
{{- if .Values.rbac.devModeWildcard }}
  # =====================================================================
  # WARNING: rbac.devModeWildcard=true -- DEV-MODE WILDCARD RBAC.
  # This ClusterRole grants unrestricted access to ALL resources in ALL
  # API groups. This MUST NOT be used in shared, staging, or production
  # environments. Set rbac.devModeWildcard=false and populate
  # rbac.allowlist instead before promoting this release.
  # =====================================================================
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- else }}
{{- range .Values.rbac.allowlist }}
  - apiGroups: {{ .apiGroups | toJson }}
    resources: {{ .resources | toJson }}
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
{{- end }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperfleet-applier.fullname" . }}
  labels:
    {{- include "hyperfleet-applier.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hyperfleet-applier.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperfleet-applier.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
